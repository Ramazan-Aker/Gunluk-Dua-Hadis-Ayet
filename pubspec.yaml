name: daily_dua_hadith
description: A beautiful Flutter app to display daily Dua, Hadith, and Quran Ayah
publish_to: 'none'
version: 2.0.2+34

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.2
  google_fonts: ^6.2.1
  scrollable_positioned_list: ^0.3.8
  
  # State Management & Data
  shared_preferences: ^2.2.2
  
  # Networking
  http: ^1.2.2
  cached_network_image: ^3.3.1
  
  # Sharing
  share_plus: ^13.3.0
  path_provider: ^2.1.2
  
  # Screenshot/Image Generation
  widgets_to_image: ^2.0.1
  
  # Ads
  # 9.1.0, Xcode 26'da GoogleMobileAds_Beta private header'ini public
  # framework modulu icinden dahil ettigi icin iOS archive'i bozuyor.
  google_mobile_ads: 9.0.0
  app_tracking_transparency: ^2.0.6
  
  # Utilities
  intl: ^0.18.1
  characters: ^1.4.0
  in_app_review: ^2.0.12
  package_info_plus: ^10.2.1
  url_launcher: ^6.3.2
  
  # Audio playback
  audioplayers: ^6.1.0
  just_audio: ^0.10.6
  audio_service: ^0.18.18
  audio_session: ^0.2.2
  flutter_tts: ^4.2.5
  
  # Notifications
  flutter_local_notifications: ^17.2.3
  timezone: ^0.9.4

  # Qibla finder
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  flutter_compass: ^0.8.1
  
  # Firebase
  firebase_core: ^3.6.0
  firebase_analytics: ^11.3.3
  firebase_crashlytics: ^4.1.3
  firebase_remote_config: ^5.5.0
  home_widget: ^0.9.3
  flutter_native_splash: ^2.4.4

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.3

flutter_native_splash:
  color: "#002542"
  image: assets/app_icon.png
  android: true
  ios: true
  android_gravity: center
  fullscreen: true
  android_12:
    color: "#002542"
    image: assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  adaptive_icon_background: "#002542"
  adaptive_icon_foreground: "assets/app_icon.png"

flutter:
  uses-material-design: true
  
  # Assets
  assets:
    - assets/data.json
    - assets/greeting_messages.json
    - assets/ready_message_designs.json
    - assets/message_backgrounds/
    - assets/quran_offline.json
