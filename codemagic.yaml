workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Apple Developer

    environment:
      groups:
        - ios_signing
      flutter: stable
      xcode: latest
      ruby: 3.3.8
      cocoapods: default
      vars:
        BUNDLE_ID: "com.tahram.gunlukduahadis"
        WIDGET_BUNDLE_ID: "com.tahram.gunlukduahadis.DailyVerseWidget"
        APPLE_TEAM_ID: "F7TL9YHWSA"
        APP_STORE_APPLE_ID: "6792362734"

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Flutter Launcher Icons (iOS)
        script: flutter pub run flutter_launcher_icons

      - name: Flutter Native Splash
        script: flutter pub run flutter_native_splash:create

      - name: Disable Swift Package Manager (CocoaPods uyumu)
        script: flutter config --no-enable-swift-package-manager

      - name: Pod install
        script: |
          cd ios
          gem install cocoapods --no-document
          pod install --repo-update
          cd ..

      - name: iOS widget target oluştur
        script: |
          ruby tool/add_ios_widget_target.rb
          xcodebuild -project ios/Runner.xcodeproj -list

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch iOS signing files
        script: |
          set -eo pipefail

          if [ -z "${CM_CERTIFICATE:-}" ] || [ -z "${CM_CERTIFICATE_PASSWORD:-}" ]; then
            echo "CM_CERTIFICATE veya CM_CERTIFICATE_PASSWORD tanımlı değil."
            exit 1
          fi

          printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          openssl pkcs12 \
            -in /tmp/certificate.p12 \
            -nodes \
            -nocerts \
            -passin env:CM_CERTIFICATE_PASSWORD \
            | openssl pkey -out /tmp/certificate_private_key.pem
          chmod 600 /tmp/certificate_private_key.pem

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/certificate_private_key.pem
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/certificate_private_key.pem

          rm -f /tmp/certificate.p12 /tmp/certificate_private_key.pem

      - name: Add signing certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Set build number
        script: |
          IOS_BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"
          cd ios
          agvtool new-version -all "$IOS_BUILD_NUMBER"

      - name: iOS yapılandırma dosyaları oluştur
        script: |
          flutter build ios --config-only --no-codesign --build-number="$IOS_BUILD_NUMBER"
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build iOS IPA
        script: |
          set -eo pipefail

          if [ ! -f /Users/builder/export_options.plist ]; then
            echo "Codemagic export_options.plist oluşturamadı."
            exit 1
          fi

          flutter build ipa --release \
            --build-number="$IOS_BUILD_NUMBER" \
            --export-options-plist=/Users/builder/export_options.plist


    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
