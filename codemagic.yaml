workflows:
  ios-release:
    name: iOS App Store Release
    max_build_duration: 120
    instance_type: mac_mini_m2

    integrations:
      app_store_connect: Apple Developer

    environment:
      groups:
        - ios_signing
      flutter: stable
      xcode: latest
      ruby: 3.3.8
      cocoapods: default
      vars:
        BUNDLE_ID: "com.tahram.gunlukduahadis"
        WIDGET_BUNDLE_ID: "com.tahram.gunlukduahadis.DailyVerseWidget"
        APPLE_TEAM_ID: "F7TL9YHWSA"
        APP_STORE_APPLE_ID: "6792362734"

    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Flutter Launcher Icons (iOS)
        script: flutter pub run flutter_launcher_icons

      - name: Flutter Native Splash
        script: flutter pub run flutter_native_splash:create

      - name: Disable Swift Package Manager (CocoaPods uyumu)
        script: flutter config --no-enable-swift-package-manager

      - name: Pod install
        script: |
          cd ios
          gem install cocoapods --no-document
          pod install --repo-update
          cd ..

      - name: iOS widget target oluştur
        script: |
          ruby tool/add_ios_widget_target.rb
          xcodebuild -project ios/Runner.xcodeproj -list

      - name: Set up keychain
        script: keychain initialize

      - name: Fetch iOS signing files
        script: |
          set -eo pipefail

          if [ -z "${CM_CERTIFICATE:-}" ] || [ -z "${CM_CERTIFICATE_PASSWORD:-}" ]; then
            echo "CM_CERTIFICATE veya CM_CERTIFICATE_PASSWORD tanımlı değil."
            exit 1
          fi

          printf '%s' "$CM_CERTIFICATE" | base64 --decode > /tmp/certificate.p12
          openssl pkcs12 \
            -in /tmp/certificate.p12 \
            -nodes \
            -nocerts \
            -passin env:CM_CERTIFICATE_PASSWORD \
            | openssl pkey -out /tmp/certificate_private_key.pem
          chmod 600 /tmp/certificate_private_key.pem

          app-store-connect fetch-signing-files "$BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/certificate_private_key.pem
          app-store-connect fetch-signing-files "$WIDGET_BUNDLE_ID" \
            --type IOS_APP_STORE \
            --create \
            --certificate-key @file:/tmp/certificate_private_key.pem

          rm -f /tmp/certificate.p12 /tmp/certificate_private_key.pem

      - name: Add signing certificates to keychain
        script: keychain add-certificates

      - name: Set up code signing settings on Xcode project
        script: xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Set build number
        script: |
          IOS_BUILD_NUMBER=$(($(app-store-connect get-latest-testflight-build-number "$APP_STORE_APPLE_ID") + 1))
          echo "IOS_BUILD_NUMBER=$IOS_BUILD_NUMBER" >> "$CM_ENV"
          cd ios
          agvtool new-version -all "$IOS_BUILD_NUMBER"

      - name: iOS yapılandırma dosyaları oluştur
        script: |
          flutter build ios --config-only --no-codesign --build-number="$IOS_BUILD_NUMBER"
          xcode-project use-profiles --project ios/Runner.xcodeproj

      - name: Build iOS IPA
        script: |
          set -eo pipefail

          profile_name_for_bundle() {
            TARGET_BUNDLE_ID="$1"
            PROFILES_HOME="$HOME/Library/MobileDevice/Provisioning Profiles"

            for PROFILE in "$PROFILES_HOME"/*.mobileprovision; do
              [ -f "$PROFILE" ] || continue
              DECODED_PROFILE="$(mktemp /tmp/profile.XXXXXX.plist)"
              if ! security cms -D -i "$PROFILE" > "$DECODED_PROFILE" 2>/dev/null; then
                rm -f "$DECODED_PROFILE"
                continue
              fi

              PROFILE_APP_ID=$(/usr/libexec/PlistBuddy -c "Print :Entitlements:application-identifier" "$DECODED_PROFILE" 2>/dev/null || true)
              PROFILE_NAME=$(/usr/libexec/PlistBuddy -c "Print :Name" "$DECODED_PROFILE" 2>/dev/null || true)
              rm -f "$DECODED_PROFILE"

              if [ "$PROFILE_APP_ID" = "$APPLE_TEAM_ID.$TARGET_BUNDLE_ID" ]; then
                printf '%s' "$PROFILE_NAME"
                return 0
              fi
            done

            return 1
          }

          MAIN_PROFILE_NAME="$(profile_name_for_bundle "$BUNDLE_ID")"
          WIDGET_PROFILE_NAME="$(profile_name_for_bundle "$WIDGET_BUNDLE_ID")"
          echo "Ana profil: $MAIN_PROFILE_NAME"
          echo "Widget profili: $WIDGET_PROFILE_NAME"

          # ExportOptions oluştur
          cat > /tmp/ExportOptions.plist << PLIST_EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store</string>
            <key>teamID</key>
            <string>F7TL9YHWSA</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$BUNDLE_ID</key>
              <string>$MAIN_PROFILE_NAME</string>
              <key>$WIDGET_BUNDLE_ID</key>
              <string>$WIDGET_PROFILE_NAME</string>
            </dict>
          </dict>
          </plist>
          PLIST_EOF

          # Archive olustur
          xcodebuild \
            -workspace ios/Runner.xcworkspace \
            -scheme Runner \
            -configuration Release \
            -sdk iphoneos \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            archive \
            -archivePath /tmp/Runner.xcarchive

          # IPA export
          mkdir -p build/ios/ipa
          xcodebuild \
            -exportArchive \
            -archivePath /tmp/Runner.xcarchive \
            -exportOptionsPlist /tmp/ExportOptions.plist \
            -exportPath build/ios/ipa


    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
      - flutter_drive.log

    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
